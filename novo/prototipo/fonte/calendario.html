<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Creator · Calendário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/*BASE*/
.titulo{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.titulo h2{font-size:28px;font-weight:700;letter-spacing:-.03em}
.titulo p{color:var(--texto-2);margin-top:4px}
.titulo .esp{flex:1}
.mes-sel{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:99px}
.mes-sel b{padding:0 10px;font-size:13px;font-weight:600;min-width:118px;text-align:center}
.mes-sel button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--texto-2)}
.mes-sel button:hover{background:var(--vidro-2);color:var(--texto)}
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filtros .rot{font-size:12px;color:var(--texto-3);margin-right:2px}
.fcli{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:99px;font-size:12.5px;color:var(--texto-2);background:var(--vidro-1);border:1px solid var(--borda);transition:all .2s}
.fcli .av{width:22px;height:22px;font-size:8.5px;margin:0}
.fcli[aria-pressed=false]{opacity:.45}
.fcli[aria-pressed=false] .av{filter:grayscale(1)}
.filtros .esp{flex:1}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--texto-3)}
.leg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}

.corpo-c{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.cal{padding:14px;border-radius:24px;min-width:0}
.sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.sem span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3);text-align:center}
.grade-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dia{min-height:118px;padding:7px;border-radius:14px;background:var(--fosco);border:1px solid color-mix(in srgb,var(--tinta) 4%,transparent);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .2s,border-color .2s}
.dia.fora{opacity:.3}
.dia.fds{background:color-mix(in srgb,var(--tinta) 1.5%,transparent)}
.dia.hoje{border-color:color-mix(in srgb,var(--laranja) 55%,transparent);background:color-mix(in srgb,var(--laranja) 6%,transparent)}
.dia.alvo{border-color:var(--laranja);background:color-mix(in srgb,var(--laranja) 12%,transparent)}
.dia-n{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--texto-2);padding:0 2px}
.dia.hoje .dia-n{color:var(--laranja-claro)}
.dia-n small{font-size:10px;font-weight:600;color:var(--texto-3)}
.ev{display:flex;align-items:center;gap:5px;width:100%;padding:3px 6px 3px 3px;border-radius:8px;font-size:11px;font-weight:500;text-align:left;cursor:grab;
  background:color-mix(in srgb,var(--tinta) 7%,transparent);border:1px solid color-mix(in srgb,var(--tinta) 6%,transparent);min-width:0;transition:transform .15s,opacity .15s}
.ev:hover{background:color-mix(in srgb,var(--tinta) 13%,transparent)}
.ev.arrastando{opacity:.35}
.ev .av{width:17px;height:17px;font-size:7px;margin:0;flex:none}
.ev span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--c)}
.mais{font-size:11px;color:var(--texto-3);padding:2px 6px;text-align:left}
.mais:hover{color:var(--texto)}

.lado{display:flex;flex-direction:column;gap:14px}
.bloco{padding:16px;border-radius:22px}
.bloco h3{font-size:14px;font-weight:600}
.bloco>p{font-size:12px;color:var(--texto-3);margin-top:2px}
.sem-data{display:flex;flex-direction:column;gap:6px;margin-top:12px;min-height:60px;padding:6px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--tinta) 10%,transparent);transition:all .2s}
.sem-data.alvo{border-color:var(--laranja);background:color-mix(in srgb,var(--laranja) 8%,transparent)}
.sem-data .ev{padding:6px 8px 6px 4px;font-size:12px}
.sem-data .ev .av{width:20px;height:20px}
.carga-m{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.cm{display:grid;grid-template-columns:22px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px}
.cm .av{width:22px;height:22px;font-size:8.5px;margin:0}
.cm .tr{height:6px;border-radius:99px;background:color-mix(in srgb,var(--tinta) 7%,transparent);overflow:hidden}
.cm .tr i{display:block;height:100%;border-radius:99px;background:var(--laranja)}
.cm b{text-align:right;font-weight:600}
.cm small{grid-column:2/4;margin-top:-5px;color:var(--texto-3);font-size:11px}

.veu{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.veu.aberto{display:grid;animation:aparece .25s}
@keyframes aparece{from{opacity:0}}
.modal{width:min(460px,100%);padding:22px;border-radius:26px;background:color-mix(in srgb,var(--superficie) 85%,transparent)}
.modal h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal>p{color:var(--texto-3);font-size:12.5px;margin-top:2px}
.lista-dia{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ld{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--fosco);text-decoration:none;color:inherit}
.ld:hover{background:color-mix(in srgb,var(--tinta) 6%,transparent)}
.ld .av{width:28px;height:28px;font-size:10px;margin:0}
.ld div{flex:1;min-width:0}
.ld b{display:block;font-size:13px;font-weight:600}
.ld small{color:var(--texto-3);font-size:11.5px}
.st{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--tinta) 6%,transparent);white-space:nowrap}
.modal .fecha{margin-top:16px;width:100%;justify-content:center}
.btn.fantasma{color:var(--texto-2);background:var(--fosco);border:1px solid var(--borda)}
.toast{position:fixed;z-index:40;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;padding:12px 18px;border-radius:16px;font-size:13px;transition:all .35s var(--mola);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1240px){.corpo-c{grid-template-columns:1fr}.lado{display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:760px){.lado{grid-template-columns:1fr}.dia{min-height:64px;padding:4px}.ev{font-size:0;padding:0;height:6px;border:0;background:var(--c);cursor:pointer}.ev .av,.ev span{display:none}.ev i{display:none}.dia-n small{display:none}.sem span{font-size:9.5px;letter-spacing:0}.titulo h2{font-size:23px}.leg{display:none}}
</style>
</head>
<body>
<!--FUNDO-->
<div class="app">
<!--LATERAL:calendario-->
  <main class="principal">
    <header class="topo">
      <h1>Calendário</h1>
      <div class="esp"></div>
      <div class="mes-sel vidro"><button aria-label="Mês anterior" data-m><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button><b>Outubro 2026</b><button aria-label="Próximo mês" data-m><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button></div>
    </header>
    <div class="titulo entra"><div><h2>Calendário de publicações</h2><p data-resumo></p></div></div>

    <div class="filtros entra" style="animation-delay:.05s">
      <span class="rot">Clientes</span>
      <span data-filtros style="display:contents"></span>
      <div class="esp"></div>
      <div class="leg"><span style="--c:#76716B">Produção</span><span style="--c:var(--laranja)">Com o cliente</span><span style="--c:#9BE3B0">Aprovado</span><span style="--c:#FFD4B0">Agendado</span><span style="--c:var(--ambar)">Publicado</span></div>
    </div>

    <div class="corpo-c">
      <section class="cal vidro entra" style="animation-delay:.1s">
        <div class="sem"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div>
        <div class="grade-cal" data-grade></div>
      </section>
      <aside class="lado">
        <section class="bloco vidro entra" style="animation-delay:.15s">
          <h3>Sem data</h3><p>Arraste para um dia do calendário.</p>
          <div class="sem-data" data-semdata data-dia="0"></div>
        </section>
        <section class="bloco vidro entra" style="animation-delay:.2s">
          <h3>Publicações por cliente</h3><p>Outubro · agendado + publicado / contratado</p>
          <div class="carga-m" data-porcli></div>
        </section>
      </aside>
    </div>
  </main>
</div>
<div class="veu" data-veu><div class="modal vidro especular" data-modal></div></div>
<div class="toast vidro" data-toast></div>

<script>
(function(){
  var CLI={CA:['Clínica Aurora','#7FA08A,#2F4A3F',24],FB:['Forno Bravo','#f59e0b,#b45309',38],SM:['Studio Move','#78716c,#44403c',8],CL:['Casa Lume','#ea580c,#7c2d12',16],OD:['Odonto Prado','#d97706,#78350f',12]};
  var ST={producao:['Produção','#76716B'],cliente:['Com o cliente','#FF6B1A'],aprovado:['Aprovado','#9BE3B0'],agendado:['Agendado','#FFD4B0'],publicado:['Publicado','#FFB547']};
  var HOJE=22;
  // [cliente, título, dia (0 = sem data), status]
  var E=[
    ['CA','Nossos serviços',2,'publicado'],['CA','4 sinais de hidratação',6,'publicado'],['CA','Perguntas frequentes',9,'publicado'],['CA','Um dia na clínica',13,'publicado'],['CA','Caixinha de perguntas',14,'publicado'],['CA','Antes e depois',15,'publicado'],
    ['CA','Skincare em 3 passos',23,'cliente'],['CA','Peeling dói?',24,'agendado'],['CA','Enquete tratamentos',25,'aprovado'],['CA','Protetor no inverno',27,'aprovado'],['CA','Bastidores',28,'producao'],['CA','Mitos sobre peeling',30,'producao'],['CA','Depoimento Mariana',31,'producao'],
    ['FB','Terça em dobro',6,'publicado'],['FB','Pizza do mês',8,'publicado'],['FB','Terça em dobro',13,'publicado'],['FB','Bastidores do forno',16,'publicado'],['FB','Terça em dobro',20,'publicado'],['FB','Pizza saindo do forno',21,'publicado'],
    ['FB','Promoção de sábado',24,'producao'],['FB','Horário de feriado',23,'agendado'],['FB','Terça em dobro',27,'agendado'],['FB','Black Friday · teaser',30,'producao'],
    ['SM','3 ajustes na cadeira',21,'producao'],['SM','Aula experimental',7,'publicado'],['SM','Postura no home office',14,'publicado'],['SM','Stories da semana',24,'producao'],
    ['CL','Luz quente ou fria?',23,'cliente'],['CL','Luminárias de mesa',9,'publicado'],['CL','Antes e depois sala',16,'publicado'],['CL','Trocar foto luminárias',22,'producao'],
    ['OD','4 mitos clareamento',24,'producao'],['OD','Horários de atendimento',26,'producao'],['OD','Sorriso de verdade',10,'publicado'],
    ['OD','Capa de destaques',0,'producao'],['CL','Post de Black Friday',0,'producao'],['FB','Reels do novo cardápio',0,'producao']
  ].map(function(r,i){return {i:i,cli:r[0],t:r[1],d:r[2],st:r[3]}});
  var EU=window.PULSE&&PULSE.atual();
  if(EU&&!PULSE.gerencia(EU)){Object.keys(CLI).forEach(function(k){if(!PULSE.atende(EU,k))delete CLI[k]});E=E.filter(function(e){return CLI[e.cli]});E.forEach(function(e,i){e.i=i})}
  var ativos={};Object.keys(CLI).forEach(function(k){ativos[k]=true});
  var DS=['dom','seg','ter','qua','qui','sex','sáb'];
  function $(s,c){return (c||document).querySelector(s)}
  function $$(s,c){return [].slice.call((c||document).querySelectorAll(s))}
  function av(k){return '<span class="av" style="background:linear-gradient(135deg,'+CLI[k][1]+')">'+k+'</span>'}
  function ev(e){return '<button class="ev" draggable="true" data-e="'+e.i+'" style="--c:'+ST[e.st][1]+'" title="'+CLI[e.cli][0]+' · '+e.t+' · '+ST[e.st][0]+'">'+av(e.cli)+'<span>'+e.t+'</span><i></i></button>'}
  function vis(e){return ativos[e.cli]}
  function filtros(){
    $('[data-filtros]').innerHTML=Object.keys(CLI).map(function(k){return '<button class="fcli" aria-pressed="'+ativos[k]+'" data-f="'+k+'">'+av(k)+CLI[k][0]+'</button>'}).join('');
    $$('[data-f]').forEach(function(b){b.addEventListener('click',function(){ativos[b.dataset.f]=!ativos[b.dataset.f];tudo()})});
  }
  function grade(){
    var off=3,h='';// 1/10/2026 é quinta
    for(var k=0;k<off;k++)h+='<div class="dia fora"><div class="dia-n">'+(28+k)+'</div></div>';
    for(var d=1;d<=31;d++){
      var w=(off+d-1)%7,it=E.filter(function(e){return e.d===d&&vis(e)}),max=3;
      h+='<div class="dia'+(d===HOJE?' hoje':'')+(w>=5?' fds':'')+'" data-dia="'+d+'"><div class="dia-n">'+d+(it.length?'<small>'+it.length+'</small>':'')+'</div>'+
        it.slice(0,max).map(ev).join('')+(it.length>max?'<button class="mais" data-ver="'+d+'">+'+(it.length-max)+' mais</button>':'')+'</div>';
    }
    for(var j=1;(off+31+j-1)%7;j++)h+='<div class="dia fora"><div class="dia-n">'+j+'</div></div>';
    $('[data-grade]').innerHTML=h;
    $('[data-semdata]').innerHTML=E.filter(function(e){return !e.d&&vis(e)}).map(ev).join('')||'<p style="font-size:12px;color:var(--texto-3);padding:8px;text-align:center">Tudo com data.</p>';
  }
  function porCli(){
    $('[data-porcli]').innerHTML=Object.keys(CLI).map(function(k){
      var tot=CLI[k][2],ok=E.filter(function(e){return e.cli===k&&e.d&&(e.st==='agendado'||e.st==='publicado')}).length,todos=E.filter(function(e){return e.cli===k&&e.d}).length;
      return '<div class="cm">'+av(k)+'<div class="tr"><i style="width:'+Math.min(100,ok/tot*100)+'%"></i></div><b>'+ok+'/'+tot+'</b><small>'+CLI[k][0]+' · '+todos+' no calendário</small></div>';
    }).join('');
  }
  function resumo(){
    var v=E.filter(vis),c={};v.forEach(function(e){c[e.st]=(c[e.st]||0)+1});
    $('[data-resumo]').innerHTML=v.filter(function(e){return e.d}).length+' publicações em outubro · <span style="color:var(--ambar)">'+(c.publicado||0)+((c.publicado||0)===1?' publicada':' publicadas')+'</span> · '+(c.agendado||0)+((c.agendado||0)===1?' agendada':' agendadas')+' · <span style="color:var(--laranja-claro)">'+(c.cliente||0)+' com o cliente</span> · '+(c.producao||0)+' em produção';
  }
  var arr=null;
  function liga(){
    $$('.ev').forEach(function(b){
      b.addEventListener('dragstart',function(e){arr=+b.dataset.e;b.classList.add('arrastando');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',b.dataset.e)});
      b.addEventListener('dragend',function(){b.classList.remove('arrastando');$$('.alvo').forEach(function(x){x.classList.remove('alvo')})});
      b.addEventListener('click',function(){var e=E[+b.dataset.e];if(e.d)dia(e.d)});
    });
    $$('[data-dia]').forEach(function(z){
      z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('alvo')});
      z.addEventListener('dragleave',function(e){if(!z.contains(e.relatedTarget))z.classList.remove('alvo')});
      z.addEventListener('drop',function(e){e.preventDefault();if(arr===null)return;var x=E[arr],n=+z.dataset.dia;arr=null;
        if(x.st==='publicado'){aviso('Esse já foi publicado e não pode mudar de data');tudo();return}
        x.d=n;tudo();aviso(n?'“'+x.t+'” foi para '+DS[(3+n)%7]+', '+n+'/10'+(x.st==='agendado'?'. O agendamento foi atualizado.':''):'“'+x.t+'” ficou sem data')});
    });
    $$('[data-ver]').forEach(function(b){b.addEventListener('click',function(){dia(+b.dataset.ver)})});
  }
  function dia(d){
    var it=E.filter(function(e){return e.d===d&&vis(e)});
    $('[data-modal]').innerHTML='<h3>'+DS[(3+d)%7]+', '+d+' de outubro</h3><p>'+it.length+' publicaç'+(it.length===1?'ão':'ões')+'</p><div class="lista-dia">'+
      it.map(function(e){return '<a class="ld" href="'+(e.cli==='CA'?'cliente.html':'demandas.html')+'">'+av(e.cli)+'<div><b>'+e.t+'</b><small>'+CLI[e.cli][0]+'</small></div><span class="st" style="--c:'+ST[e.st][1]+'">'+ST[e.st][0]+'</span></a>'}).join('')+
      '</div><button class="btn fantasma fecha" data-fechar>Fechar</button>';
    $('[data-veu]').classList.add('aberto');$('[data-fechar]').addEventListener('click',fecha);
  }
  function fecha(){$('[data-veu]').classList.remove('aberto')}
  $('[data-veu]').addEventListener('click',function(e){if(e.target===this)fecha()});
  addEventListener('keydown',function(e){if(e.key==='Escape')fecha()});
  $$('[data-m]').forEach(function(b){b.addEventListener('click',function(){aviso('No protótipo só outubro tem dados')})});
  var tt;function aviso(m){var t=$('[data-toast]');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
  function tudo(){filtros();grade();porCli();resumo();liga()}
  tudo();
})();
</script>
</body>
</html>
