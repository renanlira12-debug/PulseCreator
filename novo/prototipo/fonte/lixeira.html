<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Creator · Lixeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/*BASE*/
.titulo{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.titulo h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.titulo p{color:var(--texto-2);margin-top:4px}
.titulo .esp{flex:1}
.btn.fantasma{color:var(--texto-2);background:var(--fosco);border:1px solid var(--borda)}
.btn.fantasma:hover{color:var(--texto)}
.btn.perigo{color:var(--vermelho);background:color-mix(in srgb,var(--vermelho) 8%,transparent);border:1px solid color-mix(in srgb,var(--vermelho) 35%,transparent)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12.5px;color:var(--texto-2);background:var(--vidro-1);border:1px solid var(--borda)}
.chip span{font-size:11px;color:var(--texto-3)}
.chip[aria-pressed=true]{color:#1d0c03;background:linear-gradient(135deg,var(--laranja-claro),var(--laranja));border-color:transparent;font-weight:600}
.chip[aria-pressed=true] span{color:#1d0c03;opacity:.7}
.lista{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--vidro-1);border:1px solid var(--borda);transition:opacity .3s,transform .3s}
.it.saindo{opacity:0;transform:translateX(20px)}
.it .ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;color:var(--texto-2);background:var(--fosco)}
.it .ic.arte{color:var(--creme,#F1E9DC);background:#2F4A3F;font-size:7px;font-weight:900;text-transform:uppercase;text-align:center;line-height:1.05;padding:3px}
.it div.t{flex:1;min-width:0}
.it b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{display:block;margin-top:2px;font-size:12px;color:var(--texto-3)}
.it .resta{font-size:12px;color:var(--texto-3);white-space:nowrap}
.it .resta.pouco{color:var(--vermelho);font-weight:600}
.it .acoes{display:flex;gap:6px}
.it .acoes .btn{padding:7px 12px;font-size:12.5px}
.vazio{padding:50px 20px;text-align:center;color:var(--texto-3);border:1px dashed var(--borda);border-radius:22px}
.vazio b{display:block;color:var(--texto);font-size:15px;margin-bottom:4px}
.toast{position:fixed;z-index:40;left:50%;top:22px;transform:translate(-50%,-20px);opacity:0;padding:12px 18px;border-radius:16px;font-size:13px;transition:all .35s var(--mola);pointer-events:none;max-width:calc(100% - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:620px){.it{flex-wrap:wrap}.it .acoes{width:100%;justify-content:flex-end}.it .resta{order:3}}
</style>
</head>
<body>
<!--FUNDO-->
<div class="app">
<!--LATERAL:lixeira-->
  <main class="principal">
    <header class="topo"><h1>Lixeira</h1><div class="esp"></div></header>
    <div class="titulo entra"><div><h2>Lixeira</h2><p>O que foi apagado fica aqui por 30 dias. Depois disso, some de vez.</p></div><div class="esp"></div><button class="btn perigo" data-esvaziar>Esvaziar a lixeira</button></div>
    <div class="filtros entra" data-filtros></div>
    <div class="lista" data-lista></div>
  </main>
</div>
<div class="toast vidro" data-toast></div>
<!--CONTEUDOS-->
<script>
(function(){
  var P=window.PULSE,EU=P?P.atual():null,CT=window.CONTEUDOS,PODE=!EU||P.faz(EU,'excluir_card');
  var EXTRA=[
    {id:'r1',tipo:'Referência',nome:'Carrossel de tutorial com fundo azul',onde:'Biblioteca · Geral',quem:'Bianca',dias:3},
    {id:'d1',tipo:'Demanda',nome:'Story de feriado (versão antiga)',onde:'Forno Bravo',quem:'Lia',dias:12},
    {id:'a1',tipo:'Arquivo',nome:'logo-antigo-forno-bravo.png',onde:'Arquivos · Forno Bravo › Marca',quem:'Davi',dias:26},
    {id:'c1',tipo:'Contrato',nome:'Rascunho de proposta · Casa Lume',onde:'Contratos',quem:'Renan',dias:29}
  ];
  var TIPOS=['Conteúdo','Demanda','Referência','Arquivo','Contrato'],f='todos';
  function $(s){return document.querySelector(s)}
  function $$(s){return [].slice.call(document.querySelectorAll(s))}
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  var ICO={'Conteúdo':'','Demanda':'<rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/>','Referência':'<path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/>','Arquivo':'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>','Contrato':'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>'};
  function itens(){var c=CT?CT.lista().filter(function(x){return x.tipo==='lixeira'}).map(function(x){return {id:'ct'+x.id,ct:x,tipo:'Conteúdo',nome:x.titulo,onde:'Clínica Aurora · '+x.formato,quem:'você',dias:0}}):[];return c.concat(EXTRA)}
  function desenha(){var L=itens();
    $('[data-filtros]').innerHTML='<button class="chip" aria-pressed="'+(f==='todos')+'" data-f="todos">Tudo <span>'+L.length+'</span></button>'+TIPOS.map(function(t){var n=L.filter(function(x){return x.tipo===t}).length;return n?'<button class="chip" aria-pressed="'+(f===t)+'" data-f="'+t+'">'+t+' <span>'+n+'</span></button>':''}).join('');
    $$('[data-f]').forEach(function(b){b.addEventListener('click',function(){f=b.dataset.f;desenha()})});
    var V=L.filter(function(x){return f==='todos'||x.tipo===f});
    $('[data-lista]').innerHTML=V.length?V.map(function(x){var resta=30-x.dias;
      return '<div class="it" data-it="'+x.id+'">'+(x.ct?'<span class="ic arte">'+x.ct.chamada.replace(/<[^>]+>/g,'').slice(0,16)+'</span>':'<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ICO[x.tipo]+'</svg></span>')+
        '<div class="t"><b>'+esc(x.nome)+'</b><small>'+x.tipo+' · '+esc(x.onde)+' · apagado por '+esc(x.quem)+(x.dias?' há '+x.dias+' dias':' agora')+'</small></div>'+
        '<span class="resta'+(resta<=3?' pouco':'')+'">'+(resta<=1?'some amanhã':'some em '+resta+' dias')+'</span>'+
        '<div class="acoes"><button class="btn fantasma" data-rest="'+x.id+'">Restaurar</button>'+(PODE?'<button class="btn perigo" data-apaga="'+x.id+'">Excluir de vez</button>':'')+'</div></div>'}).join(''):
      '<div class="vazio"><b>A lixeira está vazia</b>O que for apagado aparece aqui por 30 dias.</div>';
    $$('[data-rest]').forEach(function(b){b.addEventListener('click',function(){var x=itens().filter(function(i){return i.id===b.dataset.rest})[0];some(b,function(){
      if(x.ct)CT.salva(x.ct.id,{tipo:x.ct.deAba||'post'});else EXTRA=EXTRA.filter(function(i){return i!==x});aviso('“'+x.nome+'” voltou para '+x.onde.split(' · ')[0])})})});
    $$('[data-apaga]').forEach(function(b){b.addEventListener('click',function(){var x=itens().filter(function(i){return i.id===b.dataset.apaga})[0];if(!confirm('Excluir “'+x.nome+'” de vez? Não dá para desfazer.'))return;some(b,function(){
      if(x.ct)CT.salva(x.ct.id,{tipo:'excluido'});else EXTRA=EXTRA.filter(function(i){return i!==x});aviso('Excluído de vez')})})});
    $('[data-esvaziar]').style.display=PODE&&L.length?'':'none';
  }
  function some(b,fn){var it=b.closest('.it');it.classList.add('saindo');setTimeout(function(){fn();desenha()},280)}
  $('[data-esvaziar]').addEventListener('click',function(){if(!confirm('Esvaziar a lixeira? Tudo aqui some de vez.'))return;itens().forEach(function(x){if(x.ct)CT.salva(x.ct.id,{tipo:'excluido'})});EXTRA=[];desenha();aviso('Lixeira vazia')});
  var tt;function aviso(m){var t=$('[data-toast]');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}
  desenha();
})();
</script>
</body>
</html>
