<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Aurora · Mensagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/*BASE*/
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:480px;border-radius:28px;overflow:hidden;margin-top:4px}
.chat-cab{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid color-mix(in srgb,var(--tinta) 7%,transparent)}
.equipe{display:flex}
.equipe .av{width:34px;height:34px;font-size:11px;margin:0 0 0 -8px;border:2px solid var(--superficie)}
.equipe .av:first-child{margin-left:0}
.chat-cab b{display:block;font-size:14px}
.chat-cab small{display:flex;align-items:center;gap:6px;color:var(--texto-3);font-size:12px}
.chat-cab small i{width:7px;height:7px;border-radius:50%;background:#9BE3B0;box-shadow:0 0 6px #9BE3B0}
.chat-cab .esp{flex:1}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.sep{align-self:center;margin:12px 0 6px;padding:4px 12px;border-radius:99px;font-size:11.5px;color:var(--texto-3);background:var(--fosco)}
.m{display:flex;gap:9px;max-width:min(78%,560px);align-items:flex-end;animation:chega .4s var(--mola)}
@keyframes chega{from{opacity:0;transform:translateY(8px) scale(.98)}}
.m .av{width:28px;height:28px;font-size:10px;margin:0;flex:none}
.m .b{padding:10px 14px;border-radius:18px 18px 18px 6px;font-size:13.5px;line-height:1.5;background:color-mix(in srgb,var(--tinta) 7%,transparent);border:1px solid var(--borda);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.m .quem{display:block;font-size:11.5px;font-weight:600;color:var(--laranja-claro);margin-bottom:2px}
.m .h{display:block;margin-top:4px;font-size:10.5px;color:var(--texto-3);text-align:right}
.m.eu{align-self:flex-end;flex-direction:row-reverse}
.m.eu .b{border-radius:18px 18px 6px 18px;color:#1d0c03;background:linear-gradient(135deg,var(--laranja-claro),var(--laranja) 60%);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px color-mix(in srgb,var(--laranja) 25%,transparent)}
.m.eu .h{color:color-mix(in srgb,var(--superficie) 60%,transparent)}
.m.cont{margin-top:-2px}
.m.cont .av{visibility:hidden}
.ref{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border-radius:12px;background:rgba(0,0,0,.25);text-decoration:none;color:inherit}
.ref .mini{width:38px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:7px;font-weight:900;text-align:center;line-height:1;color:#F1E9DC;background:#2F4A3F}
.ref b{display:block;font-size:12.5px}
.ref small{font-size:11px;color:var(--texto-3)}
.arq{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.2)}
.arq .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tinta) 10%,transparent);flex:none}
.arq b{display:block;font-size:12.5px}
.arq small{font-size:11px;opacity:.7}
.fotos{display:grid;grid-template-columns:repeat(3,64px);gap:4px;margin-top:8px}
.fotos span{height:64px;border-radius:9px;background:linear-gradient(135deg,#7FA08A,#2F4A3F)}
.fotos span:nth-child(2){background:linear-gradient(135deg,#F1E9DC,#C9B79C)}
.fotos span:nth-child(3){background:linear-gradient(135deg,#5E7F6B,#1E2F28)}
.digitando .b{display:flex;gap:4px;padding:14px}
.digitando .b i{width:7px;height:7px;border-radius:50%;background:var(--texto-2);animation:pula 1s infinite}
.digitando .b i:nth-child(2){animation-delay:.15s}.digitando .b i:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.rapidas{display:flex;gap:6px;padding:0 20px 10px;overflow-x:auto;scrollbar-width:none}
.rapidas button{flex:none;padding:7px 12px;border-radius:99px;font-size:12px;color:var(--texto-2);background:var(--fosco);border:1px solid var(--borda)}
.rapidas button:hover{color:var(--texto);border-color:color-mix(in srgb,var(--laranja) 40%,transparent)}
.escrever{display:flex;align-items:flex-end;gap:8px;padding:12px 16px 16px;border-top:1px solid color-mix(in srgb,var(--tinta) 7%,transparent)}
.escrever .clip{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--texto-2);background:var(--fosco);border:1px solid var(--borda);cursor:pointer}
.escrever .clip:hover{color:var(--texto)}
.escrever textarea{flex:1;max-height:120px;min-height:42px;padding:11px 16px;border-radius:22px;resize:none;background:var(--fosco);border:1px solid var(--borda);color:var(--texto);font:inherit;font-size:13.5px;outline:none;line-height:1.4}
.escrever textarea:focus{border-color:color-mix(in srgb,var(--laranja) 50%,transparent)}
.escrever .env{width:42px;height:42px;border-radius:50%;padding:0;justify-content:center;flex:none}
.anexando{display:none;align-items:center;gap:8px;margin:0 16px 0;padding:8px 12px;border-radius:12px;font-size:12px;background:var(--vidro-2)}
.anexando.on{display:flex}
.anexando button{margin-left:auto;color:var(--texto-3)}
@media (max-width:620px){.chat{height:calc(100vh - 150px);border-radius:22px}.m{max-width:88%}.msgs{padding:14px}.chat-cab .so-largo{display:none}}
</style>
</head>
<body>
<!--FUNDO-->
<div class="portal-pag">
<!--PORTAL:mensagens-->
  <main class="conteudo-portal" style="padding-bottom:20px">
    <section class="chat vidro especular entra">
      <header class="chat-cab">
        <div class="equipe"><span class="av" style="background:linear-gradient(135deg,#FF9A57,#C2410C)">BS</span><span class="av" style="background:linear-gradient(135deg,#a16207,#713f12)">DL</span><span class="av" style="background:linear-gradient(135deg,#FFB547,#C2410C)">RN</span></div>
        <div><b>Estúdio Faísca</b><small><i></i>Bianca, Davi e Renan · respondem em até 2 h</small></div>
        <div class="esp"></div>
        <a class="btn fantasma so-largo" href="portal-pedidos.html" style="text-decoration:none">Fazer um pedido</a>
      </header>
      <div class="msgs" data-msgs></div>
      <div class="rapidas" data-rapidas>
        <button>Pode me mandar o planejamento de novembro?</button>
        <button>Aprovei tudo, obrigada!</button>
        <button>Podemos marcar uma reunião?</button>
      </div>
      <div class="anexando" data-anexando><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg><span data-nome></span><button data-tirar aria-label="Remover anexo">×</button></div>
      <form class="escrever" data-form>
        <label class="clip" aria-label="Anexar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg><input type="file" hidden data-arq></label>
        <textarea rows="1" placeholder="Escreva para a agência…" aria-label="Mensagem" data-txt></textarea>
        <button class="btn primario env" aria-label="Enviar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </section>
  </main>
</div>

<script>
(function(){
  var EQ={BS:['Bianca','#FF9A57,#C2410C'],DL:['Davi','#a16207,#713f12'],RN:['Renan','#FFB547,#C2410C']};
  var EU='<span class="av" style="background:linear-gradient(135deg,#7FA08A,#2F4A3F)">AR</span>';
  var M=[
    ['sep','Terça, 20 de outubro'],
    ['RN','Oi, Ana! O planejamento de outubro está completo no portal. Qualquer coisa é só falar por aqui.','09:12'],
    ['eu','Perfeito, vou olhar hoje ainda.','09:40'],
    ['sep','Ontem'],
    ['eu','Mandei as fotos novas da sala de atendimento para o carrossel.','16:38',{fotos:1}],
    ['BS','Recebi! Vou trocar o slide 3 e te mando para aprovar.','17:05'],
    ['BS','Enquanto isso, esse aqui está esperando você:','17:06',{ref:['Protetor solar no inverno?','Post · ter 27/10']}],
    ['sep','Hoje'],
    ['DL','Bom dia! Subi o relatório de setembro em Arquivos.','08:30',{arq:['relatorio-setembro.pdf','1,2 MB']}]
  ];
  var RESPOSTAS=['Combinado! Já vou ver isso.','Anotado, te retorno ainda hoje.','Ótimo! Vou passar para a equipe.'];
  function $(s,c){return (c||document).querySelector(s)}
  function $$(s,c){return [].slice.call((c||document).querySelectorAll(s))}
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  function html(m,ant){
    if(m[0]==='sep')return '<div class="sep">'+m[1]+'</div>';
    var eu=m[0]==='eu',x=m[3]||{},cont=ant&&ant[0]===m[0];
    var extra='';
    if(x.fotos)extra='<div class="fotos"><span></span><span></span><span></span></div>';
    if(x.ref)extra='<a class="ref" href="portal-planejamento.html"><span class="mini">PROTETOR<br>SOLAR</span><div><b>'+x.ref[0]+'</b><small>'+x.ref[1]+' · toque para aprovar</small></div></a>';
    if(x.arq)extra='<div class="arq"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg></span><div><b>'+esc(x.arq[0])+'</b><small>'+x.arq[1]+'</small></div></div>';
    var av=eu?EU:'<span class="av" style="background:linear-gradient(135deg,'+EQ[m[0]][1]+')">'+m[0]+'</span>';
    return '<div class="m'+(eu?' eu':'')+(cont?' cont':'')+'">'+av+'<div class="b">'+(!eu&&!cont?'<span class="quem">'+EQ[m[0]][0]+'</span>':'')+(m[1]?esc(m[1]):'')+extra+'<span class="h">'+m[2]+'</span></div></div>';
  }
  function desenha(){var box=$('[data-msgs]');box.innerHTML=M.map(function(m,i){return html(m,M[i-1])}).join('');box.scrollTop=box.scrollHeight}
  function agora(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  var anexo=null,n=0;
  function envia(txt){
    txt=(txt||'').trim();if(!txt&&!anexo)return;
    M.push(['eu',txt,agora(),anexo?{arq:[anexo,'anexo']}:null]);anexo=null;$('[data-anexando]').classList.remove('on');desenha();
    var box=$('[data-msgs]');
    setTimeout(function(){box.insertAdjacentHTML('beforeend','<div class="m digitando" data-dig><span class="av" style="background:linear-gradient(135deg,'+EQ.BS[1]+')">BS</span><div class="b"><i></i><i></i><i></i></div></div>');box.scrollTop=box.scrollHeight},500);
    setTimeout(function(){M.push(['BS',RESPOSTAS[n++%RESPOSTAS.length],agora()]);desenha()},1900);
  }
  var txt=$('[data-txt]');
  txt.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(120,this.scrollHeight)+'px'});
  txt.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('[data-form]').requestSubmit()}});
  $('[data-form]').addEventListener('submit',function(e){e.preventDefault();envia(txt.value);txt.value='';txt.style.height=''});
  $$('[data-rapidas] button').forEach(function(b){b.addEventListener('click',function(){envia(b.textContent)})});
  $('[data-arq]').addEventListener('change',function(){if(!this.files[0])return;anexo=this.files[0].name;$('[data-nome]').textContent=anexo;$('[data-anexando]').classList.add('on');this.value=''});
  $('[data-tirar]').addEventListener('click',function(){anexo=null;$('[data-anexando]').classList.remove('on')});
  desenha();
})();
</script>
</body>
</html>
