<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Aurora · Planejamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/*BASE*/
:root{--salvia:#2F4A3F;--creme:#F1E9DC}
.cab-p{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cab-p .esp{flex:1}
.cab-p .pilulas button{padding:8px 15px;font-size:12.5px;font-weight:600}
.contagem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.ct{padding:14px 16px;border-radius:18px;text-align:left;width:100%}
.ct b{display:block;font-size:26px;font-weight:700;letter-spacing:-.04em}
.ct small{font-size:12.5px;color:var(--texto-2)}
.ct.l{border-color:color-mix(in srgb,var(--laranja) 45%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--laranja) 14%,transparent),color-mix(in srgb,var(--laranja) 3%,transparent))}
.ct.l b{color:var(--laranja-claro)}

.secao-p{margin-top:28px}
.secao-p>h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3)}
.secao-p>h3 span{padding:1px 8px;border-radius:99px;background:var(--fosco);border:1px solid var(--borda);letter-spacing:0}
.secao-p.urgente>h3{color:var(--laranja-claro)}
.grade-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.post{display:flex;flex-direction:column;padding:10px;border-radius:22px;text-align:left;width:100%;cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tinta) 7%,transparent),color-mix(in srgb,var(--tinta) 3%,transparent));border:1px solid var(--borda);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 28px rgba(0,0,0,.4);transition:transform .25s var(--mola)}
.post:hover{transform:translateY(-3px)}
.urgente .post{border-color:color-mix(in srgb,var(--laranja) 40%,transparent)}
.post .info{padding:10px 4px 2px}
.post .info b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.post .info small{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--texto-3);font-size:12px}
.post .acoes-p{display:flex;gap:6px;margin-top:10px}
.post .acoes-p .btn{flex:1;justify-content:center;padding:8px 10px;font-size:12px}
.metr{display:flex;gap:10px;margin-top:8px;font-size:11.5px;color:var(--texto-2)}
.metr span{display:inline-flex;align-items:center;gap:4px}
.selo-st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.selo-st.aguarda{color:var(--laranja-claro);background:color-mix(in srgb,var(--laranja) 14%,transparent)}
.selo-st.agendado{color:#FFD4B0;background:rgba(255,212,176,.1)}
.selo-st.publicado{color:var(--ambar);background:rgba(255,181,71,.12)}
.selo-st.ajuste{color:#E8E1D8;background:color-mix(in srgb,var(--tinta) 8%,transparent)}
.producao-l{display:flex;flex-direction:column;gap:8px}
.prod{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--fosco);border:1px solid color-mix(in srgb,var(--tinta) 5%,transparent)}
.prod .bolinha{width:8px;height:8px;border-radius:50%;background:var(--texto-3);flex:none}
.prod b{flex:1;font-weight:500;font-size:13px}
.prod small{color:var(--texto-3);font-size:12px}

/* arte do cliente */
.arte{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;isolation:isolate}
.arte.story{aspect-ratio:9/16;max-height:320px}
.a1{background:var(--salvia);color:var(--creme)}
.a2{background:var(--creme);color:var(--salvia)}
.a3{background:radial-gradient(120% 90% at 20% 10%,#7FA08A,#2F4A3F 70%);color:var(--creme)}
.arte .txt{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;z-index:1}
.arte .kick{font-size:9.5px;font-weight:700;letter-spacing:.14em;opacity:.75;text-transform:uppercase}
.arte .h{margin-top:auto;font-size:22px;line-height:1.02;font-weight:900;letter-spacing:-.035em;text-transform:uppercase}
.arte .h em{font-style:normal;color:#C9A76A}
.a2 .h em{color:#B07D3C}
.arte .rodape{margin-top:12px;display:flex;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.8}
.arte .circ{position:absolute;z-index:0;border-radius:50%;opacity:.16;background:currentColor}
.arte .play{position:absolute;z-index:2;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tinta) 22%,transparent);backdrop-filter:blur(8px)}
.arte .pag{position:absolute;z-index:2;right:10px;bottom:10px;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.4)}

/* calendário */
.cal{display:none;margin-top:20px;padding:16px;border-radius:24px}
.ver-cal .cal{display:block}.ver-cal .lista-p{display:none}
.cal-sem{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.cal-sem span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3);text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cd{min-height:96px;padding:7px;border-radius:14px;background:var(--fosco);border:1px solid color-mix(in srgb,var(--tinta) 4%,transparent);display:flex;flex-direction:column;gap:4px}
.cd.fora{opacity:.3}
.cd.hoje{border-color:color-mix(in srgb,var(--laranja) 50%,transparent);background:color-mix(in srgb,var(--laranja) 6%,transparent)}
.cd>small{font-size:11.5px;font-weight:600;color:var(--texto-2)}
.cd.hoje>small{color:var(--laranja-claro)}
.ev{display:block;width:100%;text-align:left;padding:3px 7px;border-radius:7px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb,var(--tinta) 6%,transparent)}
.ev:hover{background:color-mix(in srgb,var(--tinta) 12%,transparent)}
.legenda-cal{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--texto-3)}
.legenda-cal span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}

/* visualizador */
.veu{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);overflow:auto}
.veu.aberto{display:grid;animation:aparece .25s ease}
@keyframes aparece{from{opacity:0}}
.visor{width:min(940px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:28px;overflow:hidden;background:color-mix(in srgb,var(--superficie) 85%,transparent);animation:sobe .4s var(--mola)}
@keyframes sobe{from{transform:translateY(18px) scale(.98);opacity:0}}
.visor .lado-arte{padding:20px;background:rgba(0,0,0,.25);display:flex;align-items:center}
.visor .lado-arte .arte{width:100%}
.visor .lado-arte .arte .h{font-size:34px}
.visor .lado-txt{display:flex;flex-direction:column;padding:22px;max-height:min(86vh,720px)}
.v-cab{display:flex;align-items:center;gap:10px}
.v-cab .av{width:34px;height:34px;font-size:10px;margin:0;background:var(--salvia);color:var(--creme)}
.v-cab b{display:block;font-size:13px}
.v-cab small{color:var(--texto-3);font-size:11.5px}
.v-cab .esp{flex:1}
.v-corpo{flex:1;overflow:auto;margin-top:14px}
.v-corpo h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.dica-sel{display:flex;align-items:center;gap:7px;margin:10px 0;font-size:12px;color:var(--laranja-claro)}
.legenda-v{white-space:pre-wrap;font-size:13.5px;line-height:1.65;color:var(--texto);padding:14px 16px;border-radius:16px;background:var(--fosco);border:1px solid var(--borda)}
.legenda-v ::selection,.legenda-v::selection{background:color-mix(in srgb,var(--laranja) 45%,transparent)}
.legenda-v mark{background:color-mix(in srgb,var(--laranja) 25%,transparent);color:inherit;border-bottom:1.5px solid var(--laranja);border-radius:2px}
.balao{position:fixed;z-index:30;display:none;padding:5px;border-radius:14px;background:color-mix(in srgb,var(--superficie) 92%,transparent)}
.balao.on{display:block;animation:aparece .2s ease}
.balao button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--laranja-claro)}
.balao button:hover{background:var(--vidro-2)}
.coments{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.coments h4{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-3)}
.cm{padding:11px 13px;border-radius:4px 16px 16px 16px;background:color-mix(in srgb,var(--laranja) 7%,transparent);border:1px solid color-mix(in srgb,var(--laranja) 28%,transparent);font-size:13px}
.cm.ag{background:var(--fosco);border-color:var(--borda)}
.cm .q{display:block;margin-bottom:5px;padding:3px 8px;border-left:2px solid var(--laranja);font-size:12px;color:var(--texto-2);background:color-mix(in srgb,var(--tinta) 3%,transparent)}
.cm small{display:block;margin-top:5px;font-size:11px;color:var(--texto-3)}
.novo-cm{display:none;margin-top:12px;padding:12px;border-radius:16px;background:var(--fosco);border:1px solid color-mix(in srgb,var(--laranja) 40%,transparent)}
.novo-cm.on{display:block;animation:aparece .2s}
.novo-cm .q{display:block;margin-bottom:8px;padding:3px 8px;border-left:2px solid var(--laranja);font-size:12px;color:var(--texto-2)}
.novo-cm textarea{width:100%;min-height:70px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--borda);color:var(--texto);font:inherit;font-size:13px;resize:vertical;outline:none}
.novo-cm .bt{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.novo-cm .bt .btn{padding:8px 14px;font-size:12.5px}
.v-pe{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--tinta) 7%,transparent)}
.v-pe .btn{flex:1;justify-content:center}
.feito{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ambar);background:rgba(255,181,71,.1)}

@media (max-width:820px){.visor{grid-template-columns:1fr}.visor .lado-arte{padding:16px 16px 0}.visor .lado-arte .arte{max-width:260px;margin:0 auto}.visor .lado-arte .arte .h{font-size:24px}.visor .lado-txt{max-height:none}}
@media (max-width:640px){.contagem{grid-template-columns:1fr 1fr}.cd{min-height:64px;padding:5px}.ev{font-size:0;padding:0;height:6px;border-left:0;background:var(--c)}.grade-p{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.post{min-width:0}.post .info small{flex-wrap:wrap}.arte .h{font-size:15px}.arte .txt{padding:12px}.post .acoes-p{flex-direction:column}}
</style>
</head>
<body>
<!--FUNDO-->
<div class="portal-pag" id="pag">
<!--PORTAL:planejamento-->
  <main class="conteudo-portal">
    <div class="cab-p entra">
      <div><h2 class="ola-p">Seu planejamento de <em>outubro</em></h2><p class="sub-p">Tudo o que a agência preparou para a Clínica Aurora: o que já foi ao ar, o que está agendado e o que precisa de você.</p></div>
      <div class="esp"></div>
      <div class="pilulas vidro" role="group" aria-label="Visualização" data-pilulas>
        <span class="lente"></span>
        <button aria-pressed="true" data-v="lista">Lista</button>
        <button aria-pressed="false" data-v="cal">Calendário</button>
      </div>
    </div>

    <section class="contagem" data-contagem></section>

    <div class="lista-p" data-lista></div>

    <section class="cal vidro" data-cal>
      <div class="cal-sem"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div>
      <div class="cal-g" data-cal-g></div>
      <div class="legenda-cal"><span style="--c:var(--laranja)">Espera sua aprovação</span><span style="--c:#FFD4B0">Agendado</span><span style="--c:var(--ambar)">Publicado</span><span style="--c:#8A857E">Em ajuste</span></div>
    </section>
  </main>
</div>

<div class="veu" data-veu><div class="visor vidro especular" data-visor role="dialog" aria-modal="true"></div></div>
<div class="balao vidro" data-balao><button data-comentar><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Comentar este trecho</button></div>
<div class="toast vidro" data-toast></div>

<script>
(function(){
  // status do ponto de vista do cliente: aguarda (aprovação), ajuste (pediu ajuste), agendado, publicado
  var P=[
    {t:'Rotina de skincare em 3 passos',ch:'Rotina de skincare em <em>3 passos</em>',e:'a1',f:'Carrossel',d:23,h:'18h',st:'aguarda',
     leg:'Rotina boa é rotina que você consegue manter.\n\nLimpeza, hidratação e protetor solar: esses 3 passos já cuidam de quase tudo o que a sua pele precisa no dia a dia.\n\nSalva esse post pra lembrar e marca aquela amiga que tem 12 produtos na pia.\n\nAgende sua avaliação pelo link da bio.',
     cm:[['Adorei! Dá pra trocar a foto do slide 3? Queria uma com a nossa sala de atendimento.','“skincare em 3 passos”','Você · ontem, 16:40',0],['Claro! Vou usar as fotos do último ensaio e te mando de novo hoje.','','Bianca · Estúdio Faísca · ontem, 17:05',1]]},
    {t:'Protetor solar no inverno?',ch:'Protetor solar no <em>inverno?</em>',e:'a2',f:'Post',d:27,h:'12h',st:'aguarda',
     leg:'Nublou, esfriou… e o protetor ficou na gaveta?\n\nA radiação UVA atravessa as nuvens e as janelas o ano inteiro. No inverno ela continua lá, só que a gente não sente.\n\nUse todo dia, reaplique a cada 3 horas se estiver na rua.',cm:[]},
    {t:'Peeling dói?',ch:'Peeling <em>dói?</em>',e:'a1',f:'Reels',d:24,h:'19h',st:'agendado',leg:'A pergunta que mais ouvimos no consultório, respondida em 35 segundos.',cm:[]},
    {t:'Enquete: qual tratamento?',ch:'Qual você <em>quer</em> fazer?',e:'a2',f:'Story',d:25,h:'10h',st:'agendado',leg:'Enquete nos stories com os 3 tratamentos mais procurados.',cm:[]},
    {t:'Nossos serviços',ch:'Nossos <em>serviços</em>',e:'a1',f:'Post',d:2,h:'18h',st:'publicado',leg:'Conheça tudo o que a Clínica Aurora faz por você.',cm:[],m:['3,2 mil','184','41']},
    {t:'4 sinais de que sua pele pede hidratação',ch:'4 sinais de que sua pele pede <em>hidratação</em>',e:'a2',f:'Carrossel',d:6,h:'12h',st:'publicado',leg:'Repuxando, opaca, descamando…',cm:[],m:['5,8 mil','402','126']},
    {t:'Perguntas que mais recebemos',ch:'Perguntas que mais <em>recebemos</em>',e:'a3',f:'Post',d:9,h:'18h',st:'publicado',leg:'Separamos as dúvidas mais comuns.',cm:[],m:['2,9 mil','150','37']},
    {t:'Um dia na clínica',ch:'Um dia na <em>clínica</em>',e:'a3',f:'Reels',d:13,h:'19h',st:'publicado',leg:'Bastidores de um dia normal por aqui.',cm:[],m:['11,4 mil','820','95']},
    {t:'Caixinha de perguntas',ch:'Manda a sua <em>dúvida</em>',e:'a3',f:'Story',d:14,h:'10h',st:'publicado',leg:'Caixinha aberta nos stories.',cm:[],m:['1,1 mil','63','—']},
    {t:'Antes e depois · limpeza de pele',ch:'Antes &amp; <em>depois</em>',e:'a1',f:'Story',d:15,h:'10h',st:'publicado',leg:'Resultado de uma limpeza de pele.',cm:[],m:['1,4 mil','88','—']}
  ];
  var PROD=[['Mitos sobre peeling','Carrossel · prevista para 30/10'],['Depoimento da Mariana','Post · prevista para 31/10'],['Agenda de novembro aberta','Post · prevista para 31/10'],['Bastidores do atendimento','Reels · prevista para 28/10'],['Lembrete de horários','Story · prevista para 27/10']];
  var DS=['dom','seg','ter','qua','qui','sex','sáb'];
  var COR={aguarda:'var(--laranja)',agendado:'#FFD4B0',publicado:'var(--ambar)',ajuste:'#8A857E'};
  var ROT={aguarda:'Espera sua aprovação',agendado:'Agendado',publicado:'Publicado',ajuste:'Ajuste pedido'};
  function $(s,c){return (c||document).querySelector(s)}
  function $$(s,c){return [].slice.call((c||document).querySelectorAll(s))}
  function dia(d){var x=new Date(2026,9,d);return DS[x.getDay()]+' '+('0'+d).slice(-2)+'/10'}
  function arte(p){
    var story=p.f==='Story',ex=p.f==='Reels'?'<span class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>':p.f==='Carrossel'?'<span class="pag">1/5</span>':'';
    return '<div class="arte '+p.e+(story?' story':'')+'"><span class="circ" style="width:180px;height:180px;right:-60px;top:-50px"></span><span class="circ" style="width:90px;height:90px;left:-30px;bottom:30%"></span>'+
      '<div class="txt"><span class="kick">'+(story?'Stories':p.f==='Carrossel'?'Arraste para o lado':'Clínica Aurora')+'</span><span class="h">'+p.ch+'</span><span class="rodape"><span>AURORA</span><span>@clinicaaurora</span></span></div>'+ex+'</div>';
  }
  function selo(st){return '<span class="selo-st '+st+'">'+ROT[st]+'</span>'}
  function card(p,i){
    var ac=p.st==='aguarda'?'<div class="acoes-p"><button class="btn fantasma" data-abrir="'+i+'">Pedir ajuste</button><button class="btn primario" data-aprovar="'+i+'">Aprovar</button></div>':'';
    var mt=p.m?'<div class="metr"><span><b>'+p.m[0]+'</b> alcance</span><span><b>'+p.m[1]+'</b> curtidas</span></div>':'';
    return '<div class="post" data-abrir="'+i+'" tabindex="0">'+arte(p)+'<div class="info"><b>'+p.t+'</b><small>'+p.f+' · '+dia(p.d)+' · '+p.h+'</small>'+
      (p.st!=='aguarda'?'<div style="margin-top:8px">'+selo(p.st)+'</div>':'')+mt+ac+'</div></div>';
  }
  function contagem(){
    var c={aguarda:0,agendado:0,publicado:0};P.forEach(function(p){if(c[p.st]!==undefined)c[p.st]++});
    $('[data-contagem]').innerHTML=
      '<button class="ct vidro l" data-ir="aguarda"><b>'+c.aguarda+'</b><small>esperam sua aprovação</small></button>'+
      '<button class="ct vidro" data-ir="agendado"><b>'+c.agendado+'</b><small>agendados</small></button>'+
      '<button class="ct vidro" data-ir="publicado"><b>'+c.publicado+'</b><small>publicados</small></button>'+
      '<button class="ct vidro" data-ir="producao"><b>'+PROD.length+'</b><small>em produção</small></button>';
    $$('[data-ir]').forEach(function(b){b.addEventListener('click',function(){var s=$('[data-sec="'+b.dataset.ir+'"]');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})})});
  }
  function lista(){
    var grupos=[['aguarda','Esperam sua aprovação','urgente'],['ajuste','Ajuste pedido',''],['agendado','Agendados',''],['publicado','Já foram ao ar','']];
    var h=grupos.map(function(g){
      var it=P.map(function(p,i){return [p,i]}).filter(function(x){return x[0].st===g[0]});
      if(!it.length)return '';
      return '<section class="secao-p '+g[2]+'" data-sec="'+g[0]+'"><h3>'+g[1]+'<span>'+it.length+'</span></h3><div class="grade-p">'+it.map(function(x){return card(x[0],x[1])}).join('')+'</div></section>';
    }).join('');
    h+='<section class="secao-p" data-sec="producao"><h3>Em produção<span>'+PROD.length+'</span></h3><div class="producao-l">'+
      PROD.map(function(p){return '<div class="prod"><span class="bolinha"></span><b>'+p[0]+'</b><small>'+p[1]+'</small></div>'}).join('')+
      '</div><p style="margin-top:10px;font-size:12px;color:var(--texto-3)">A agência ainda está criando. Assim que ficar pronto, aparece aqui para você aprovar.</p></section>';
    $('[data-lista]').innerHTML=h;
    liga();
  }
  function calendario(){
    var h='',ini=new Date(2026,9,1),off=(ini.getDay()+6)%7;
    for(var k=0;k<off;k++)h+='<div class="cd fora"><small>'+(30-off+k+1)+'</small></div>';
    for(var d=1;d<=31;d++){
      var ev=P.map(function(p,i){return [p,i]}).filter(function(x){return x[0].d===d});
      h+='<div class="cd'+(d===22?' hoje':'')+'"><small>'+d+'</small>'+ev.map(function(x){return '<button class="ev" style="--c:'+COR[x[0].st]+'" data-abrir="'+x[1]+'" title="'+x[0].t+'">'+x[0].t+'</button>'}).join('')+'</div>';
    }
    var tot=off+31;for(var j=1;tot%7;j++,tot++)h+='<div class="cd fora"><small>'+j+'</small></div>';
    $('[data-cal-g]').innerHTML=h;
    liga();
  }
  function liga(){
    $$('[data-abrir]').forEach(function(b){if(b._l)return;b._l=1;b.addEventListener('click',function(e){e.stopPropagation();abre(+b.dataset.abrir,b.tagName==='BUTTON'&&b.classList.contains('btn'))})});
    $$('[data-aprovar]').forEach(function(b){if(b._l)return;b._l=1;b.addEventListener('click',function(e){e.stopPropagation();aprova(+b.dataset.aprovar)})});
  }
  function tudo(){contagem();lista();calendario()}

  // visualizador
  var atual=null,trecho='';
  function cmHtml(c){return '<div class="cm'+(c[3]?' ag':'')+'">'+(c[1]?'<span class="q">'+c[1]+'</span>':'')+c[0]+'<small>'+c[2]+'</small></div>'}
  function abre(i,ajuste){
    atual=i;var p=P[i];
    var pe=p.st==='aguarda'||p.st==='ajuste'?'<div class="v-pe"><button class="btn fantasma" data-pedir>Pedir ajuste</button><button class="btn primario" data-ok>Aprovar este conteúdo</button></div>':
      '<div class="v-pe"><span class="feito">'+(p.st==='publicado'?'✓ Publicado em '+dia(p.d):'✓ Aprovado · vai ao ar '+dia(p.d)+' às '+p.h)+'</span></div>';
    $('[data-visor]').innerHTML='<div class="lado-arte">'+arte(p)+'</div><div class="lado-txt">'+
      '<div class="v-cab"><span class="av">AUR</span><div><b>clinicaaurora</b><small>'+p.f+' · '+dia(p.d)+' · '+p.h+'</small></div><span class="esp"></span>'+selo(p.st)+
      '<button class="btn fantasma" style="padding:8px 10px;margin-left:6px" data-fechar aria-label="Fechar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
      '<div class="v-corpo"><h3>'+p.t+'</h3>'+(p.st==='aguarda'||p.st==='ajuste'?'<p class="dica-sel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3"/></svg>Selecione um trecho da legenda para comentar só ele.</p>':'<div style="height:12px"></div>')+
      '<div class="legenda-v" data-leg>'+p.leg+'</div>'+
      '<div class="novo-cm" data-novo><span class="q" data-q></span><textarea placeholder="O que você quer mudar?" data-txt></textarea><div class="bt"><button class="btn fantasma" data-cancelar>Cancelar</button><button class="btn primario" data-enviar>Enviar comentário</button></div></div>'+
      '<div class="coments" data-coments>'+(p.cm.length?'<h4>Conversa sobre este conteúdo</h4>'+p.cm.map(cmHtml).join(''):'')+'</div></div>'+pe+'</div>';
    $('[data-veu]').classList.add('aberto');
    var v=$('[data-visor]');
    $('[data-fechar]',v).addEventListener('click',fecha);
    var ok=$('[data-ok]',v);if(ok)ok.addEventListener('click',function(){aprova(atual);fecha()});
    var pd=$('[data-pedir]',v);if(pd)pd.addEventListener('click',function(){trecho='';novo()});
    $('[data-cancelar]',v).addEventListener('click',function(){$('[data-novo]').classList.remove('on')});
    $('[data-enviar]',v).addEventListener('click',envia);
    $('[data-leg]',v).addEventListener('mouseup',seleciona);
    $('[data-leg]',v).addEventListener('touchend',function(){setTimeout(seleciona,50)});
    if(ajuste){trecho='';novo()}
  }
  function seleciona(){
    var s=getSelection(),txt=s.toString().trim(),b=$('[data-balao]');
    if(!txt||!$('[data-leg]').contains(s.anchorNode)||!(P[atual].st==='aguarda'||P[atual].st==='ajuste')){b.classList.remove('on');return}
    var r=s.getRangeAt(0).getBoundingClientRect();trecho=txt;
    b.style.left=Math.max(8,Math.min(innerWidth-200,r.left+r.width/2-90))+'px';b.style.top=Math.max(8,r.top-50)+'px';b.classList.add('on');
  }
  $('[data-comentar]').addEventListener('mousedown',function(e){e.preventDefault()});
  $('[data-comentar]').addEventListener('click',function(){
    var s=getSelection();
    if(s.rangeCount){try{var m=document.createElement('mark');s.getRangeAt(0).surroundContents(m)}catch(x){}}
    s.removeAllRanges();$('[data-balao]').classList.remove('on');novo();
  });
  function novo(){var n=$('[data-novo]');$('[data-q]').textContent=trecho?'“'+trecho+'”':'Sobre o conteúdo inteiro';n.classList.add('on');$('[data-txt]').value='';$('[data-txt]').focus()}
  function envia(){
    var t=$('[data-txt]').value.trim();if(!t){$('[data-txt]').focus();return}
    var p=P[atual];p.cm.push([t.replace(/</g,'&lt;'),trecho?'“'+trecho+'”':'','Você · agora',0]);p.st='ajuste';
    var i=atual;tudo();abre(i);aviso('Pedido de ajuste enviado. A agência já foi avisada.');
  }
  function aprova(i){P[i].st='agendado';tudo();aviso('Aprovado! “'+P[i].t+'” vai ao ar '+dia(P[i].d)+' às '+P[i].h+'.')}
  function fecha(){$('[data-veu]').classList.remove('aberto');$('[data-balao]').classList.remove('on')}
  $('[data-veu]').addEventListener('click',function(e){if(e.target===this)fecha()});
  addEventListener('keydown',function(e){if(e.key==='Escape')fecha()});

  var tt;function aviso(m){var t=$('[data-toast]');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2800)}

  var g=$('[data-pilulas]'),lente=g.querySelector('.lente');
  function move(b,an){lente.style.width=b.offsetWidth+'px';lente.style.transform='translateX('+b.offsetLeft+'px)';if(an){lente.classList.remove('esticando');void lente.offsetWidth;lente.classList.add('esticando')}}
  lente.style.transition='none';move(g.querySelector('[aria-pressed=true]'));requestAnimationFrame(function(){lente.style.transition=''});
  g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;$$('button',g).forEach(function(x){x.setAttribute('aria-pressed',x===b)});move(b,true);$('#pag').classList.toggle('ver-cal',b.dataset.v==='cal')});
  addEventListener('resize',function(){move(g.querySelector('[aria-pressed=true]'))});
  tudo();
})();
</script>
</body>
</html>
