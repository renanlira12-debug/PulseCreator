<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprovação de posts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap">
<link rel="icon" href="assets/icone.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
body{background:var(--painel)}
.pub{max-width:760px;margin:0 auto;padding:28px 18px 70px}
.marca-p{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tinta-3);margin-bottom:28px}
.marca-p b{font-family:var(--titulo);font-weight:600;color:var(--tinta);letter-spacing:-.03em}
.perfil{display:flex;align-items:center;gap:26px;margin-bottom:22px}
.perfil .av{width:96px;height:96px;font-size:28px;box-shadow:0 0 0 3px var(--painel),0 0 0 5px var(--laranja)}
.perfil h1{font-size:26px}
.perfil p{color:var(--tinta-2);margin-top:4px}
.nums{display:flex;gap:22px;margin-top:10px;font-size:14.5px;color:var(--tinta-2)}
.nums b{color:var(--tinta)}
.aviso-ap{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;margin-bottom:18px;font-size:15px;background:var(--laranja-suave);color:var(--laranja-tinta)}
.aviso-ap.ok{background:var(--verde-suave);color:var(--verde)}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:18px;overflow:hidden}
.tile{position:relative;aspect-ratio:4/5;display:flex;align-items:flex-end;padding:12px;color:#F6EFE8;cursor:pointer;background:linear-gradient(155deg,var(--c),#141110);text-align:left}
.tile b{font-family:var(--titulo);font-weight:600;font-size:12px;letter-spacing:-.03em;line-height:1.15;text-transform:uppercase}
.tile .st{position:absolute;top:8px;right:8px;height:22px;padding:0 8px;border-radius:99px;display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.45)}
.tile .st.ok{background:#2E8A57}.tile .st.aj{background:#B94A0C}.tile .st.ag{background:var(--laranja)}
.tile.ag::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--laranja)}
.rod{margin-top:30px;text-align:center;font-size:13px;color:var(--tinta-3)}
@media (max-width:560px){.perfil{gap:16px}.perfil .av{width:70px;height:70px;font-size:20px}.perfil h1{font-size:20px}.tile b{font-size:9.5px}}
</style>
</head>
<body data-area="publico">
<div class="pub" data-pub></div>
<script src="assets/dados.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  var S=DB.S,$=UI.$,$$=UI.$$,esc=UI.esc,ico=UI.ico;
  var C=DB.cliente(new URLSearchParams(location.search).get('c'));
  if(!C){$('[data-pub]').innerHTML='<div class="vazio-l" style="margin-top:60px"><b>Link inválido</b>Peça um novo link para a agência.</div>';return}
  document.title='Aprovação · '+C.nome;
  function desenha(){var L=S.pautas.filter(function(p){return p.cliente===C.id&&p.visivelCliente&&['Post','Carrossel','Reels'].indexOf(p.formato)>=0}).sort(function(a,b){return a.prazo<b.prazo?1:-1}),pd=L.filter(function(p){return p.coluna==='cliente'&&!p.aprovacao});
    $('[data-pub]').innerHTML='<div class="marca-p"><span class="av p" style="--c:var(--laranja)">'+ico('raio',14,' fill="#fff"')+'</span><span><b>'+esc(S.config.agencia)+'</b> · aprovação de posts</span></div>'+
      '<div class="perfil">'+UI.avCli(C)+'<div><h1>'+esc(C.insta||C.nome)+'</h1><p>'+esc(C.nome)+' · '+esc(C.seg)+'</p><div class="nums"><span><b>'+L.length+'</b> posts</span><span><b>'+pd.length+'</b> para aprovar</span></div></div></div>'+
      (pd.length?'<div class="aviso-ap">'+ico('olho',19)+'<span>Toque nos posts com borda laranja para aprovar ou pedir ajuste.</span></div>':'<div class="aviso-ap ok">'+ico('check',19)+'<span>Tudo aprovado. Obrigado!</span></div>')+
      '<div class="feed">'+L.map(function(p){var ag=p.coluna==='cliente'&&!p.aprovacao,st=p.aprovacao==='aprovado'?'<span class="st ok">Aprovado</span>':p.aprovacao==='ajuste'?'<span class="st aj">Ajuste</span>':ag?'<span class="st ag">Aprovar</span>':'';return '<button class="tile v'+(p.id%4)+(ag?' ag':'')+'" style="--c:'+C.cor+'" data-p="'+p.id+'">'+st+'<b>'+esc(p.titulo)+'</b></button>'}).join('')+'</div>'+
      '<p class="rod">Esse link é só para aprovação. Para pedidos, mensagens e arquivos, entre no portal.</p>';
    $$('[data-p]').forEach(function(b){b.addEventListener('click',function(){UI.verPost(DB.pauta(+b.dataset.p),desenha)})})}
  desenha();
})();
</script>
</body>
</html>
