<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferramentas · Pulse Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@400;500;600&display=swap">
<link rel="icon" href="assets/icone.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.barra .esp{flex:1}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.fc{overflow:hidden;border-radius:28px;background:var(--cartao);border:1px solid var(--linha);box-shadow:var(--sombra);display:flex;flex-direction:column}
.capa{position:relative;height:190px;display:grid;place-items:center;color:#fff;background:radial-gradient(80% 90% at 50% 0%,var(--c2),var(--c1) 70%)}
.capa::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.4px);background-size:6px 6px;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.capa b{position:relative;z-index:1;font-family:var(--titulo);font-weight:600;font-size:26px;letter-spacing:-.04em}
.capa .tag{position:absolute;z-index:1;right:16px;bottom:16px;height:34px;padding:0 14px;border-radius:99px;display:inline-flex;align-items:center;font-size:14px;color:var(--tinta);background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
.fc .corpo{padding:22px 26px 0;flex:1}
.fc h3{display:flex;align-items:center;justify-content:space-between;font-size:21px;font-weight:600}
.fc h3 a{color:var(--tinta-2)}
.fc p{margin-top:10px;font-size:15.5px;color:var(--tinta-2);line-height:1.5}
.fc .site{margin-top:10px;font-size:14px;color:var(--tinta-3)}
.fc .ac{display:flex;align-items:center;gap:12px;margin:18px 0 0;padding:16px 0;border-top:1px solid var(--linha)}
.fc .ac small{display:block;font-size:13.5px;color:var(--tinta-3)}
.fc .ac b{display:block;font-weight:600;font-size:16px}
.fc .ac>div{flex:1;min-width:0}
.fc .det{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px 26px;border-top:1px solid var(--linha);font-size:16px;color:var(--tinta-2)}
.fc .det:hover{background:var(--cartao-2);color:var(--tinta)}
.fc.sem{opacity:.72}
.refs{columns:4 260px;column-gap:20px}
.rc{break-inside:avoid;margin-bottom:20px;border-radius:24px;overflow:hidden;background:var(--cartao);border:1px solid var(--linha);box-shadow:var(--sombra)}
.rc .img{aspect-ratio:var(--r,4/5);background:linear-gradient(150deg,var(--c),#141110);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:16px;color:#F6EFE8;font-family:var(--titulo);font-weight:600;font-size:15px;letter-spacing:-.03em;text-transform:uppercase;line-height:1.1}
.rc .t{padding:16px 18px}
.rc b{font-weight:600;font-size:15.5px}
.rc p{margin-top:6px;font-size:14px;color:var(--tinta-2)}
.rc .m{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--tinta-3)}
</style>
</head>
<body data-area="agencia" data-pag="ferramentas">
<div class="app"><aside class="lat" id="lat"></aside><main class="painel"><div class="miolo">
  <header class="cab"><div class="t"><div class="olho" data-qtd></div><h1>Ferramentas</h1><p class="sub" data-sub></p></div><div class="acoes-topo" data-acoes></div></header>
  <div class="abas" role="tablist"><button role="tab" data-aba="plat">Plataformas</button><button role="tab" data-aba="refs">Referências</button></div>
  <div class="barra"><div class="chips" data-chips></div><span class="esp"></span><button class="btn pri p" data-add></button></div>
  <div data-lista></div>
</div></main></div>
<script src="assets/dados.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  var S=DB.S,EU=UI.eu,$=UI.$,$$=UI.$$,esc=UI.esc,ico=UI.ico;if(!EU)return;
  var aba=location.hash==='#refs'?'refs':'plat',f='todas',GF=DB.pode(EU,'gerir_ferramentas');
  $$('[data-aba]').forEach(function(b){b.addEventListener('click',function(){aba=b.dataset.aba;f='todas';history.replaceState(null,'',aba==='refs'?'#refs':location.pathname);desenha()})});
  function tem(t){return t.acesso==='todos'||t.acesso.indexOf(EU.id)>=0}
  function quem(t){return t.acesso==='todos'?'Toda a equipe':t.acesso.map(function(q){var p=DB.pessoa(q);return p?DB.primeiroNome(p):''}).filter(Boolean).join(', ')}
  function desenha(){
    $$('[data-aba]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.aba===aba)});
    var add=$('[data-add]');
    if(aba==='plat'){var cats=[];S.ferramentas.forEach(function(t){if(cats.indexOf(t.cat)<0)cats.push(t.cat)});
      $('[data-qtd]').textContent=S.ferramentas.length+' plataformas';$('[data-sub]').textContent='As plataformas que a agência assina e a equipe usa no dia a dia.';
      chips([['todas','Todas'],['meus','Meus acessos']].concat(cats.map(function(c){return [c,c]})));
      add.hidden=!GF;add.innerHTML=ico('mais',18)+'Nova ferramenta';add.onclick=function(){editaF(null)};
      var L=S.ferramentas.filter(function(t){return f==='todas'||(f==='meus'?tem(t):t.cat===f)});
      $('[data-lista]').innerHTML=L.length?'<div class="grade">'+L.map(function(t){var ok=tem(t);return '<article class="fc'+(ok?'':' sem')+'"><div class="capa" style="--c1:'+t.cor1+';--c2:'+t.cor2+'"><b>'+esc(t.nome)+'</b><span class="tag">'+esc(t.cat)+'</span></div><div class="corpo"><h3>'+esc(t.nome)+'<a href="https://'+esc(t.site)+'" target="_blank" rel="noopener" aria-label="Abrir site">'+ico('externo',18)+'</a></h3><p>'+esc(t.desc)+'</p><div class="site">'+esc(t.site)+'</div><div class="ac"><div><small>Quem tem acesso</small><b>'+esc(quem(t))+'</b></div>'+(ok?'<span class="selo verde">Você tem acesso</span>':'<span class="selo">Sem acesso</span>')+'</div></div><button class="det" data-det="'+t.id+'">Ver detalhes'+ico('seta',18)+'</button></article>'}).join('')+'</div>':'<div class="vazio-l"><b>Nada por aqui</b>Nenhuma ferramenta nesse filtro.</div>';
      $$('[data-det]').forEach(function(b){b.addEventListener('click',function(){detalhe(S.ferramentas.filter(function(t){return t.id===b.dataset.det})[0])})});
    }else{var tags=[];S.refs.forEach(function(r){if(tags.indexOf(r.tag)<0)tags.push(r.tag)});
      $('[data-qtd]').textContent=S.refs.length+' referências salvas';$('[data-sub]').textContent='Ideias que a equipe guarda para usar depois: geral ou de um cliente, com o motivo de ter salvado.';
      chips([['todas','Todas']].concat(tags.map(function(t){return [t,t]})));
      add.hidden=false;add.innerHTML=ico('mais',18)+'Salvar referência';add.onclick=novaRef;
      var R=S.refs.filter(function(r){return f==='todas'||r.tag===f});
      $('[data-lista]').innerHTML=R.length?'<div class="refs">'+R.map(function(r,i){var c=r.cliente?DB.cliente(r.cliente):null,p=DB.pessoa(r.quem);return '<article class="rc"><div class="img" style="--c:'+r.cor+';--r:'+(['4/5','1/1','9/16','4/3'][i%4])+(r.img?';background-image:url('+r.img+')':'')+'">'+(r.img?'':esc(r.titulo))+'</div><div class="t"><b>'+esc(r.titulo)+'</b>'+(r.nota?'<p>'+esc(r.nota)+'</p>':'')+'<div class="m"><span class="selo">'+esc(r.tag)+'</span>'+(c?esc(c.nome):'Geral')+'<span style="margin-left:auto">'+(p?UI.av(p,'p'):'')+'</span></div></div></article>'}).join('')+'</div>':'<div class="vazio-l"><b>Nenhuma referência</b>Salve a primeira.</div>';
    }
  }
  function chips(L){$('[data-chips]').innerHTML=L.map(function(c){return '<button class="chip" data-f="'+esc(c[0])+'" aria-pressed="'+(c[0]===f)+'">'+esc(c[1])+'</button>'}).join('');$$('[data-f]').forEach(function(b){b.addEventListener('click',function(){f=b.dataset.f;desenha()})})}
  function detalhe(t){var ok=tem(t);
    var m=UI.modal('<div class="olho">'+esc(t.cat)+'</div><h2>'+esc(t.nome)+'</h2><p class="desc">'+esc(t.desc)+'</p>'+
      '<div class="cartao pad" style="box-shadow:none;background:var(--cartao-2);margin-bottom:18px"><b style="display:block;margin-bottom:6px">Como acessar</b><p style="color:var(--tinta-2)">'+(ok?esc(t.como):'Você ainda não tem acesso. Peça ao admin.')+'</p></div>'+
      '<div style="display:grid;gap:10px;font-size:15px;color:var(--tinta-2)"><div>'+ico('link',16)+' <a href="https://'+esc(t.site)+'" target="_blank" rel="noopener" style="text-decoration:underline">'+esc(t.site)+'</a></div><div>'+ico('estrela',16)+' Acesso: <b style="color:var(--tinta)">'+esc(quem(t))+'</b></div>'+(DB.pode(EU,'gestao')?'<div>'+ico('chave',16)+' Custo: <b style="color:var(--tinta)">'+UI.reais(t.valor)+'/mês</b></div>':'')+'</div>'+
      '<div class="pe">'+(GF?'<button class="btn fant" data-ex style="color:var(--vermelho);margin-right:auto">'+ico('lixo',17)+'Remover</button><button class="btn" data-ed>Editar</button>':'')+(ok?'':'<button class="btn escuro" data-pede>Pedir acesso</button>')+'</div>');
    var pe=$('[data-pede]',m.el);if(pe)pe.addEventListener('click',function(){S.equipe.filter(function(p){return p.papel==='admin'}).forEach(function(a){UI.notifica({txt:'<b>'+esc(DB.primeiroNome(EU))+'</b> pediu acesso ao <b>'+esc(t.nome)+'</b>',link:'ferramentas.html',para:a.id})});m.fecha();UI.aviso('Pedido enviado ao admin')});
    var ed=$('[data-ed]',m.el);if(ed)ed.addEventListener('click',function(){m.fecha();editaF(t)});
    var ex=$('[data-ex]',m.el);if(ex)ex.addEventListener('click',function(){if(!confirm('Remover '+t.nome+'?'))return;S.ferramentas.splice(S.ferramentas.indexOf(t),1);DB.salva('ferramentas');m.fecha();desenha();UI.aviso('Ferramenta removida')})}
  function editaF(t){var novo=!t;t=t||{id:'f'+Date.now().toString(36),nome:'',cat:'Design e vídeo',desc:'',site:'',acesso:'todos',cor1:'#2B211A',cor2:'#F26B1D',como:'',valor:0};var ac=t.acesso==='todos'?'todos':t.acesso.slice();
    var m=UI.modal('<h2>'+(novo?'Nova ferramenta':'Editar ferramenta')+'</h2><p class="desc">Nunca coloque senhas aqui. Diga onde a pessoa encontra o acesso.</p>'+
      '<div class="linha2"><label class="campo"><span>Nome</span><input class="ent" data-n="nome" value="'+esc(t.nome)+'"></label><label class="campo"><span>Categoria</span><input class="ent" data-n="cat" value="'+esc(t.cat)+'" list="cats"><datalist id="cats"><option>Design e vídeo</option><option>Agendamento</option><option>Gestão</option><option>IA</option></datalist></label></div>'+
      '<label class="campo"><span>Para que serve</span><input class="ent" data-n="desc" value="'+esc(t.desc)+'"></label>'+
      '<div class="linha2"><label class="campo"><span>Site</span><input class="ent" data-n="site" value="'+esc(t.site)+'" placeholder="exemplo.com"></label><label class="campo"><span>Custo por mês (R$)</span><input class="ent" type="number" step="0.01" data-n="valor" value="'+t.valor+'"></label></div>'+
      '<label class="campo"><span>Como acessar</span><textarea class="ent" rows="2" data-n="como">'+esc(t.como)+'</textarea></label>'+
      '<div class="campo"><span>Quem tem acesso</span><div style="display:flex;flex-wrap:wrap;gap:6px"><button class="chip p" data-todos aria-pressed="'+(ac==='todos')+'">Toda a equipe</button>'+S.equipe.map(function(p){return '<button class="chip p" data-q="'+p.id+'" aria-pressed="'+(ac!=='todos'&&ac.indexOf(p.id)>=0)+'" style="padding-left:5px;gap:7px">'+UI.av(p,'p')+DB.primeiroNome(p)+'</button>'}).join('')+'</div></div>'+
      '<div class="pe"><button class="btn pri p" data-ok>Salvar</button></div>');
    function marca(){$('[data-todos]',m.el).setAttribute('aria-pressed',ac==='todos');$$('[data-q]',m.el).forEach(function(b){b.setAttribute('aria-pressed',ac!=='todos'&&ac.indexOf(b.dataset.q)>=0)})}
    $('[data-todos]',m.el).addEventListener('click',function(){ac='todos';marca()});
    $$('[data-q]',m.el).forEach(function(b){b.addEventListener('click',function(){if(ac==='todos')ac=[];var i=ac.indexOf(b.dataset.q);if(i>=0)ac.splice(i,1);else ac.push(b.dataset.q);marca()})});
    $('[data-ok]',m.el).addEventListener('click',function(){var v={};$$('[data-n]',m.el).forEach(function(i){v[i.dataset.n]=i.value.trim()});if(!v.nome){UI.aviso('Preencha o nome');return}
      t.nome=v.nome;t.cat=v.cat||'Outros';t.desc=v.desc;t.site=v.site.replace(/^https?:\/\//,'');t.valor=+v.valor||0;t.como=v.como;t.acesso=ac==='todos'||!ac.length?'todos':ac;if(novo)S.ferramentas.push(t);DB.salva('ferramentas');m.fecha();desenha();UI.aviso('Ferramenta salva')})}
  function novaRef(){var img=null;
    var m=UI.modal('<h2>Salvar referência</h2><p class="desc">Anote por que salvou: é o que ajuda a usar depois.</p>'+
      '<label class="campo"><span>Imagem (opcional)</span><input class="ent" type="file" accept="image/*" data-img style="padding-top:14px"></label>'+
      '<label class="campo"><span>Título</span><input class="ent" data-n="titulo" placeholder="Ex.: Reels com legenda grande"></label>'+
      '<div class="linha2"><label class="campo"><span>Tipo</span><input class="ent" data-n="tag" list="tags" placeholder="Carrossel, Reels…"><datalist id="tags">'+['Carrossel','Reels','Stories','Feed','Anúncio'].map(function(t){return '<option>'+t+'</option>'}).join('')+'</datalist></label><label class="campo"><span>Cliente</span><select class="ent" data-n="cliente"><option value="">Geral</option>'+DB.meusClientes(EU).map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>'}).join('')+'</select></label></div>'+
      '<label class="campo"><span>Por que salvou</span><textarea class="ent" rows="2" data-n="nota"></textarea></label><div class="pe"><button class="btn pri p" data-ok>Salvar</button></div>');
    $('[data-img]',m.el).addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.8)};im.src=r.result};r.readAsDataURL(f)});
    $('[data-ok]',m.el).addEventListener('click',function(){var v={};$$('[data-n]',m.el).forEach(function(i){v[i.dataset.n]=i.value.trim()});if(!v.titulo){UI.aviso('Dê um título');return}
      var cli=v.cliente?DB.cliente(v.cliente):null;S.refs.unshift({id:'r'+Date.now().toString(36),titulo:v.titulo,tag:v.tag||'Geral',cliente:v.cliente||null,nota:v.nota,cor:cli?cli.cor:'#4A3A2E',quem:EU.id,img:img});
      try{DB.salva('refs')}catch(e){}m.fecha();f='todas';desenha();UI.aviso('Referência salva')})}
  desenha();
})();
</script>
</body>
</html>
